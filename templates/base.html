<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Games Portal{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/confirm.js') }}" defer></script>
</head>
<body>
  <div class="page-actions">
    {% if jellyfin_enabled %}
      {% if user %}
        <span class="user-chip">
          <a class="user-chip__name" href="{{ url_for('account') }}" title="Your requests">👤 {{ user.name }}</a>
          <a class="user-chip__out" href="{{ url_for('user_logout') }}">Sign out</a>
        </span>
      {% elif request.endpoint != 'user_login' %}
        <a class="btn secondary" href="{{ url_for('user_login', next=request.full_path.rstrip('?')) }}">Sign in</a>
      {% endif %}
    {% endif %}
    <button id="theme-toggle" class="theme-toggle" type="button"
            title="Toggle light/dark theme" aria-label="Toggle light/dark theme">🌙</button>
  </div>
  {% block body %}{% endblock %}
</body>
</html>
