{% extends "base.html" %}

<div class="wrap">

    <nav class="admin-nav">
      <div class="admin-nav__brand">⚙ Admin</div>
      <a href="{{ url_for('admin_requests') }}" class="{{ 'active' if active == 'requests' }}">Requests</a>
      <a href="{{ url_for('admin_scanner') }}" class="{{ 'active' if active == 'scanner' }}">Folder Scanner</a>

  </div>
</div>
{% endblock %}
